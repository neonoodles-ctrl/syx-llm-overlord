# Syx LLM Overlord Configuration
# Copy to config.yaml and fill in your settings.

llm:
  # Provider: openai, anthropic, ollama, together, groq, openrouter, deepseek, fireworks, api
  # 'api' = generic OpenAI-compatible endpoint (provide base_url + api_key)
  provider: openai
  model: gpt-4o
  api_key: ${OPENAI_API_KEY}
  base_url: null          # override provider default (required for 'api' provider)
  max_tokens: 2048
  temperature: 0.7

# ── Provider Quick-Reference ──────────────────────────────────────
#
# OpenAI:
#   provider: openai
#   model: gpt-4o
#   api_key: sk-...
#
# Anthropic:
#   provider: anthropic
#   model: claude-sonnet-4-20250514
#   api_key: sk-ant-...
#
# Ollama (local):
#   provider: ollama
#   model: llama3
#   # no api_key needed, runs on localhost:11434
#
# Together AI:
#   provider: together
#   model: meta-llama/Llama-3-70b-chat-hf
#   api_key: ...
#
# Groq:
#   provider: groq
#   model: llama3-70b-8192
#   api_key: gsk_...
#
# OpenRouter:
#   provider: openrouter
#   model: meta-llama/llama-3-70b-instruct
#   api_key: sk-or-...
#
# DeepSeek:
#   provider: deepseek
#   model: deepseek-chat
#   api_key: ...
#
# Fireworks:
#   provider: fireworks
#   model: accounts/fireworks/models/llama-v3-70b-instruct
#   api_key: ...
#
# Generic OpenAI-compatible API:
#   provider: api
#   model: your-model-name
#   api_key: your-key
#   base_url: https://your-endpoint.com/v1

game:
  mod_url: http://localhost:47823
  poll_interval_seconds: 5
  command_rate_limit: 3   # max commands per decision cycle

dashboard:
  port: 3847
  ws_enabled: true

logging:
  level: INFO
  file: syx-overlord.log
